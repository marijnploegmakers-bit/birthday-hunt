<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Hunt for Alex</title>
<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#2b2140;--mute:#7a6f8f;--acc:#ff5d8f;--ok:#2a9d6f;--bad:#d62839;--line:#f0dfc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1530;--card:#271f40;--ink:#f6efff;--mute:#a99cc4;--acc:#ff7aa5;--ok:#4ad19a;--bad:#ff6b78;--line:#3a3060}}
:root[data-theme="dark"]{--bg:#1b1530;--card:#271f40;--ink:#f6efff;--mute:#a99cc4;--acc:#ff7aa5;--ok:#4ad19a;--bad:#ff6b78;--line:#3a3060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;max-width:480px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative;z-index:2}
h1{font-size:1.6rem;margin:.2em 0}
p{line-height:1.5;margin:.6em 0}
.emoji{font-size:3rem}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--ok)}.dots i.cur{background:var(--acc)}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 4px}
.clue{font-size:1.2rem;font-style:italic;background:var(--bg);border-radius:14px;padding:18px}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin-top:10px}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;font-weight:bold;border:0;border-radius:999px;padding:12px 26px;margin:10px 4px 0;cursor:pointer;background:var(--acc);color:#fff}
.msg{min-height:1.4em;font-size:.95rem;margin-top:8px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
.pic{max-height:230px;max-width:100%;border-radius:14px;margin:8px 0}.big{font-size:5.5rem;line-height:1.2;margin:6px 0}
.end p{font-size:1.05rem}
</style>
</head>

var ME=NM[WHO],YOU=NM[WHO==="alex"?"ioana":"alex"],i=-1,app=document.getElementById("app");
function norm(s){return s.toLowerCase().replace(/^(a|an|the|een|de|het)\s+/,"").replace(/[^a-z]/g,"")}
function dots(n){if(n===undefined)n=i;var h='<div class="dots">';for(var k=0;k<R.length;k++)h+='<i class="'+(k<n?"done":k==n?"cur":"")+'"></i>';return h+"</div>"}
function intro(){app.innerHTML='<div class="emoji">🎁</div><h1>Hey '+ME+'!</h1><p>Your birthday prize is locked behind '+R.length+' puzzles. '+YOU+' has one too, and your clues point to the same answer.</p><p>Don’t peek at each other’s screens: read your clue out loud, compare, and find the answer together.</p><button id="go">Start</button>';
document.getElementById("go").onclick=function(){i=0;show()}}
function show(){
app.innerHTML=dots()+'<div class="lbl">Round '+(i+1)+' of '+R.length+'</div><div class="lbl">Your clue</div><div class="clue">'+R[i][WHO]+'</div>'
+'<p style="font-size:.9rem;color:var(--mute)">'+YOU+' has a different clue for the same answer.</p>'
+'<input id="ans" placeholder="The answer is…" autocomplete="off"><div class="msg" id="m"></div><button id="chk">Check</button>';
var inp=document.getElementById("ans");
inp.onkeydown=function(e){if(e.key==="Enter")check()};
document.getElementById("chk").onclick=check}
function check(){var inp=document.getElementById("ans"),m=document.getElementById("m"),v=norm(inp.value);
if(R[i].a.indexOf(v)>-1){m.className="msg ok";m.textContent="Correct! ✨";boom(40);setTimeout(reveal,600)}
else{m.className="msg bad";m.textContent="Not quite. Compare clues with "+YOU+"!";inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake")}}
function reveal(){var r=R[i],last=i===R.length-1;
var pic=r.img?'<img class="pic" alt="" src="'+r.img+'">':'<div class="big">'+(r.e||"🎉")+'</div>';
app.innerHTML=dots(i+1)+'<div class="lbl">Round '+(i+1)+' solved</div>'+pic+'<p>Yes! The answer was <b>'+r.a[0]+'</b></p><button id="nx">'+(last?"Finish":"Next round")+'</button>';
document.getElementById("nx").onclick=function(){i++;i<R.length?show():finale()}}
function finale(){app.innerHTML='<div class="end"><div class="emoji">🎂</div><h1>Happy birthday '+ME+'!</h1><p>aahhh you did it you solved the puzzle!</p><p>hope you had a wonderful birthday and enjoy this evening a lot.</p><p><b>Marijn will present you your prize:</b></p><div class="emoji">🎬</div></div>';
boom(220);setTimeout(function(){boom(160)},900);setTimeout(function(){boom(120)},1800)}
var cv=document.getElementById("c"),x=cv.getContext("2d"),ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function boom(n){var cols=["#ff5d8f","#ffb703","#4ad19a","#5ab0ff","#b388ff"];
for(var k=0;k<n;k++)ps.push({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,s:4+Math.random()*5,c:cols[k%5],l:90+Math.random()*50});
if(!run){run=true;tick()}}
function tick(){x.clearRect(0,0,cv.width,cv.height);
ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s);return p.l>0});
if(ps.length)requestAnimationFrame(tick);else run=false}
intro();
</script>
